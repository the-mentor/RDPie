[package]
name = "rdpie-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rdpie_core"
crate-type = ["rlib", "staticlib"]

[dependencies]
ironrdp-server = { version = "0.13", features = ["helper", "egfx"] }
ironrdp-egfx = "0.3"
ironrdp-cliprdr = "0.7"
ironrdp-core = "0.2"
ironrdp-dvc = "0.8"
ironrdp-svc = "0.8"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
tokio-rustls = "0.26"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
rcgen = "0.14"
tempfile = "3"
ironrdp-pdu = "0.9"
